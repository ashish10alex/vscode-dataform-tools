        description: Raw customers loaded by the ingestion job.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
      - name: orders
        description: Raw orders loaded by the ingestion job.
      - name: payments
        description: Raw payments, one row per payment attempt.
