version: 2

sources:
  - name: football_data
    tables:
      - name: TRANSFERS
      - name: PLAYERS
      - name: CLUBS

models:
  - name: stg_transfers
    description: Transfers, one row for each move of a player between two clubs
    config:
      tags: ["staging"]
  - name: stg_players
    description: Players, with the columns the marts use
    config:
      tags: ["staging"]
  - name: stg_clubs
    description: Clubs, with the competition each plays in
    config:
      tags: ["staging"]
  - name: int_signings
    description: Every transfer with the player's position and the buying club's competition
    config:
      tags: ["transfers"]
  - name: fct_player_transfers
    description: The most expensive Manchester United signing of each season
    config:
      tags: ["transfers"]
    columns:
      - name: player_id
        description: Unique identifier of a player
      - name: transfer_date
        description: Date the player moved from one club to the other
      - name: transfer_season
        description: Season of the transfer, e.g. 24/25
      - name: transfer_fee
        description: Fee paid, in euros
