on:
  push:
    branches:
      - main
    tags:
      - "*"

name: Deploy extension to marketplace
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm ci

      - name: Determine if Pre-Release (Odd Minor Version)
        id: check_prerelease
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract the version from the tag (e.g., v1.3.2 -> 1.3.2)
            VERSION=${GITHUB_REF#refs/tags/v}
            # Extract the minor version (e.g., 1.3.2 -> 3)
            MINOR=$(echo $VERSION | cut -d. -f2)
            # Check if minor is odd
            if [ $((MINOR % 2)) -ne 0 ]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          else
             # For pushes that aren't tags
             echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Package once up front so each registry publishes the same artifact and
      # neither depends on the other having run.
      - name: Package extension
        id: package
        run: |
          VSIX="${GITHUB_WORKSPACE}/extension.vsix"
          if [ "${{ steps.check_prerelease.outputs.is_prerelease }}" = "true" ]; then
            npx --yes @vscode/vsce@3 package --pre-release --out "$VSIX"
          else
            npx --yes @vscode/vsce@3 package --out "$VSIX"
          fi
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT

      # Both publish steps use continue-on-error so one registry being down
      # cannot skip the other. The gate step below still fails the job.
      - name: Publish to Visual Studio Marketplace
        id: publishToVSMarketplace
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.package.outputs.vsix }}
          preRelease: ${{ steps.check_prerelease.outputs.is_prerelease == 'true' }}
          dryRun: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Publish to Open VSX Registry
        id: publishToOpenVSX
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.package.outputs.vsix }}
          preRelease: ${{ steps.check_prerelease.outputs.is_prerelease == 'true' }}
          dryRun: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Keep the built VSIX so a registry outage can be worked around by
      # uploading it by hand, without rebuilding locally.
      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: warn

      - name: Report publish results
        if: always()
        run: |
          MARKETPLACE="${{ steps.publishToVSMarketplace.outcome }}"
          OPENVSX="${{ steps.publishToOpenVSX.outcome }}"
          {
            echo "| Registry | Result |"
            echo "| --- | --- |"
            echo "| Visual Studio Marketplace | $MARKETPLACE |"
            echo "| Open VSX | $OPENVSX |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Visual Studio Marketplace: $MARKETPLACE"
          echo "Open VSX: $OPENVSX"
          if [ "$MARKETPLACE" != "success" ] || [ "$OPENVSX" != "success" ]; then
            echo "::error::At least one registry failed to publish. Re-run the failed job once the registry recovers; publishing is idempotent per version."
            exit 1
          fi
