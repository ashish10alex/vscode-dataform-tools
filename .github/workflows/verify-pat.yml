# Temporary diagnostic: checks whether VS_MARKETPLACE_TOKEN can still authenticate
# against the Marketplace. Does not publish anything. Safe to delete.
name: Verify marketplace PAT

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: vsce verify-pat
        timeout-minutes: 6
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "RESULT: secret VS_MARKETPLACE_TOKEN is empty or unset"
            exit 1
          fi
          echo "Token length: ${#VSCE_PAT}"
          npx --yes @vscode/vsce@latest --version
          set +e
          start=$(date +%s)
          npx --yes @vscode/vsce@latest verify-pat ashishalex
          code=$?
          end=$(date +%s)
          echo "RESULT: exit=$code after $((end-start))s"
          exit $code
