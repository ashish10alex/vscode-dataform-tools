on:
  pull_request:
    branches:
      - main
      - multi_backend

name: Pull request checks

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci

      # The tests compile src/test/test-workspace with the CLI. The panel also wants gcloud on PATH, which
      # the runner image already has.
      - name: Install the Dataform CLI
        run: npm install --global @dataform/cli

      # `npm test` type-checks, builds and lints first (pretest), then runs the Backends' tests in plain Node, and the
      # unit tests, the recorded panel output (src/panelRecordings) and a dbt workspace (src/dbtWorkspace) in VS Code,
      # which needs a display.
      - name: Type-check, lint and test
        run: xvfb-run -a npm test
